name: native-build

# Build nativo do example (iOS e Android) quando o PR mexe em código nativo,
# specs do codegen ou no example. O check.yml (typecheck, lint, test) segue
# rodando em todo PR.
#
# Android compila com os stubs (GOOGLE_WALLET_ENABLED / SAMSUNG_WALLET_ENABLED
# = false): os SDKs da Google e da Samsung são do app consumidor e não ficam
# no repositório. Os source sets reais são validados no app, em device.

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'android/**'
      - 'src/specs/**'
      - 'example/**'
      - '*.podspec'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/native-build.yml'

# O build só lê o código; o GITHUB_TOKEN não precisa de escrita.
permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn install --immutable

      # O Gemfile só pede ruby ">= 2.6.10"; a action exige uma versão exata.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: example
          bundler-cache: true

      - name: Install pods
        working-directory: example/ios
        run: bundle exec pod install

      - name: Build (Debug, Simulator)
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace BuildersWalletExample.xcworkspace \
            -scheme BuildersWalletExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 50

      - name: Build (Release, Simulator) without the native mock
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace BuildersWalletExample.xcworkspace \
            -scheme BuildersWalletExample \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 50
          # O mock do Apple Wallet só existe em Debug.
          binary=build/Build/Products/Release-iphonesimulator/BuildersWalletExample.app/BuildersWalletExample
          if strings "$binary" | grep -q 'MockAppleWalletProvider'; then
            echo '::error::Mock do Apple Wallet encontrado no binário Release'
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build (Debug, stubs)
        working-directory: example/android
        run: >
          ./gradlew :app:assembleDebug --no-daemon
          -PGOOGLE_WALLET_ENABLED=false
          -PSAMSUNG_WALLET_ENABLED=false
